name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Verify tag matches package
        run: python -c "from git_churn_map import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"
      - name: Package source and checksum
        run: |
          git archive --format=zip --prefix="git-churn-map-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "git-churn-map-${GITHUB_REF_NAME}.zip"
          sha256sum "git-churn-map-${GITHUB_REF_NAME}.zip" > "git-churn-map-${GITHUB_REF_NAME}.zip.sha256"
          sha256sum --check "git-churn-map-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "git-churn-map $GITHUB_REF_NAME" --generate-notes "git-churn-map-${GITHUB_REF_NAME}.zip" "git-churn-map-${GITHUB_REF_NAME}.zip.sha256"
