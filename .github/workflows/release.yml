name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Verify tag matches package
        run: python -c "from git_churn_map import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"
      - name: Package source and checksum
        run: |
          git archive --format=zip --prefix="git-churn-map-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "git-churn-map-${GITHUB_REF_NAME}.zip"
          sha256sum "git-churn-map-${GITHUB_REF_NAME}.zip" > "git-churn-map-${GITHUB_REF_NAME}.zip.sha256"
          sha256sum --check "git-churn-map-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            git-churn-map-${{ github.ref_name }}.zip
            git-churn-map-${{ github.ref_name }}.zip.sha256
