<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Git Churn Map sample report</title><desc id="desc">A synthetic local report ranks files by line churn and warns that churn is only a review signal.</desc>
<rect width="1120" height="620" rx="28" fill="#0b1120"/><rect x="26" y="26" width="1068" height="568" rx="18" fill="#111b2b" stroke="#2c3b50"/>
<text x="68" y="92" fill="#a6f08a" font-family="monospace" font-size="18" letter-spacing="3">READ-ONLY · LOCAL GIT HISTORY</text><text x="68" y="145" fill="#eff6ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Git Churn Map</text>
<text x="68" y="190" fill="#bac8da" font-family="monospace" font-size="16">$ git-churn-map . --limit 10 --format markdown</text>
<rect x="68" y="222" width="984" height="285" rx="12" fill="#f7f9fc"/><text x="100" y="270" fill="#182333" font-family="Arial,sans-serif" font-size="22" font-weight="700">Top change hotspots · 4 commits</text>
